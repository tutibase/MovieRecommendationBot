---
- name: Provision Movie Recommendation Bot VM
  hosts: all
  become: yes  # Выполнять все задачи от root (sudo)
  gather_facts: yes

  vars:
    db_name: "users_db"
    db_user: "postgres"
    # Пароль будем передавать через --extra-vars из Jenkins или командной строки
    app_dir: "/opt/moviebot"
    app_user: "ubuntu"

  tasks:
    - name: Wait for cloud-init to complete
      wait_for:
        path: /var/lib/cloud/instance/boot-finished
        timeout: 300
      tags: always

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: common

    - name: Install prerequisites (Java, Postgres, Python libs)
      apt:
        name:
          - openjdk-21-jdk
          - postgresql
          - python3-psycopg2  # Нужно для модулей ansible postgres
          - curl
          - wget
        state: present
      tags: common

    - name: Start and enable PostgreSQL service
      systemd:
        name: postgresql
        state: started
        enabled: yes
      tags: database

    - name: Set password for postgres user
      become_user: postgres
      postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        role_attr_flags: SUPERUSER
      tags: database

    - name: Create application database
      become_user: postgres
      postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
        encoding: UTF-8
        lc_collate: C
        lc_ctype: C
        template: template0
      tags: database

    - name: Copy SQL schema to server
      copy:
        src: ../../src/main/resources/users_db.sql  # Путь к твоему SQL файлу в проекте
        dest: /tmp/schema.sql
        owner: postgres
        mode: '0644'
      tags: database

    - name: Import SQL schema into database
      become_user: postgres
      command: psql -d {{ db_name }} -f /tmp/schema.sql
      args:
        creates: /tmp/schema_imported_flag # Хак для идемпотентности, если скрипт сам не защищает от повторов
      # Примечание: Твой SQL скрипт использует IF NOT EXISTS, поэтому можно запускать многократно
      tags: database

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
      tags: app

    - name: Deploy systemd service file
      copy:
        src: moviebot.service
        dest: /etc/systemd/system/moviebot.service
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd
      tags: app

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes