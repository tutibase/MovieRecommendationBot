---
- name: Provision Movie Recommendation Bot VM
  hosts: all
  become: yes  # Выполнять все задачи от root (sudo)
  gather_facts: yes

  vars:
    db_name: "users_db"
    db_user: "postgres"
    app_dir: "/opt/moviebot"
    app_user: "ubuntu"

  tasks:
    - name: Wait for cloud-init to complete
      wait_for:
        path: /var/lib/cloud/instance/boot-finished
        timeout: 300
      tags: always

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: common

    - name: Install prerequisites (Java, Postgres, Python libs)
      apt:
        name:
          - openjdk-21-jdk
          - postgresql
          - python3-psycopg2
          - curl
          - wget
        state: present
      tags: common

    - name: Start and enable PostgreSQL service
      systemd:
        name: postgresql
        state: started
        enabled: yes
      tags: database

    # ИСПРАВЛЕНО: Запускаем от root (без become_user), передаем пользователя БД через -U
    - name: Set password for postgres user
      command: psql -U {{ db_user }} -c "ALTER USER {{ db_user }} WITH PASSWORD '{{ db_password }}';"
      tags: database

    - name: Create application database
      command: >
        psql -U {{ db_user }} -c 
        "CREATE DATABASE {{ db_name }} OWNER {{ db_user }} ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C' TEMPLATE template0;"
      register: db_create_result
      failed_when:
        - db_create_result.rc != 0
        - "'already exists' not in db_create_result.stderr"
      tags: database

    - name: Copy SQL schema to server
      copy:
        src: ../../src/main/resources/users_db.sql
        dest: /tmp/schema.sql
        mode: '0644'
      tags: database

    - name: Import SQL schema into database
      command: psql -U {{ db_user }} -d {{ db_name }} -f /tmp/schema.sql
      tags: database

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
      tags: app

    - name: Deploy systemd service file
      copy:
        src: moviebot.service
        dest: /etc/systemd/system/moviebot.service
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd
      tags: app

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes