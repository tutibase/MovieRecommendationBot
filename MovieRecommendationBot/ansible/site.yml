---
- name: Provision Movie Recommendation Bot VM
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Application settings
    app_user: polik
    app_dir: /opt/movie-bot
    app_port: 8110
    app_repo: https://github.com/tutibase/MovieRecommendationBot.git
    app_branch: poly_deploy

    # Путь к docker-compose.yml с учётом структуры проекта
    docker_compose_path: "{{ app_dir }}/MovieRecommendationBot/MovieRecommendationBot/docker-compose.yml"

  tasks:
    - name: Wait for cloud-init to complete
      wait_for:
        path: /var/lib/cloud/instance/boot-finished
        timeout: 300
      tags: always

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: common

    - name: Upgrade all packages
      apt:
        upgrade: dist
        update_cache: yes
      tags: common

    - name: Install prerequisites
      apt:
        name:
          - curl
          - git
          - wget
          - ca-certificates
          - gnupg
          - lsb-release
        state: present
      tags: common

    - name: Install Docker
      shell: |
        curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
        sh /tmp/get-docker.sh
        rm -f /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker
      tags: docker

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes
        daemon_reload: yes
      tags: docker

    - name: Add ubuntu user to docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes
      tags: docker

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
      tags: app

    - name: Clone application repository
      git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ app_branch }}"
        accept_hostkey: yes
        force: yes
      become_user: "{{ app_user }}"
      tags: app

    - name: Check if Docker Compose file exists
      stat:
        path: "{{ docker_compose_path }}"
      register: compose_file_stat
      tags: app

    - name: Install Docker Compose plugin (if needed)
      apt:
        name: docker-compose-plugin
        state: present
      when: compose_file_stat.stat.exists
      tags: deploy

    - name: Deploy application via Docker Compose
      community.docker.docker_compose:
        project_src: "{{ app_dir }}/MovieRecommendationBot/MovieRecommendationBot"
        state: present
        build: never
      when: compose_file_stat.stat.exists
      tags: deploy

    - name: Wait for application to be ready
      wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        delay: 10
        timeout: 120
      when: compose_file_stat.stat.exists
      tags: deploy

    - name: Display completion message
      debug:
        msg: |
          ✅ Movie Recommendation Bot deployed successfully!
          🌐 Application: http://{{ ansible_host }}:{{ app_port }}
          🔐 SSH: ssh -i <key> {{ app_user }}@{{ ansible_host }}
          📁 App directory: {{ app_dir }}
           Docker Compose: {{ docker_compose_path }}