---
- name: Provision Movie Recommendation Bot VM
  hosts: movie_bot_vms
  become: true
  gather_facts: true

  vars:
    app_user: ubuntu
    app_dir: /opt/movie-bot
    app_port: 8110
    app_repo: https://github.com/tutibase/MovieRecommendationBot.git
    app_branch: poly_deploy
    # Упростите путь к docker-compose.yml после клонирования
    docker_compose_path: "{{ app_dir }}/MovieRecommendationBot/docker-compose.yml"

  tasks:
    - name: Wait for cloud-init to complete
      wait_for:
        path: /var/lib/cloud/instance/boot-finished
        timeout: 300
      tags: always

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: common

    - name: Install prerequisites
      apt:
        name:
          - curl
          - git
          - wget
          - ca-certificates
          - gnupg
          - lsb-release
        state: present
      tags: common

    - name: Install Docker (official script)
      shell: |
        curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
        sh /tmp/get-docker.sh
        rm -f /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker
      tags: docker

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes
        daemon_reload: yes
      tags: docker

    - name: Add ubuntu user to docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes
      tags: docker

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
      tags: app